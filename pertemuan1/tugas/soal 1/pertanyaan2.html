<!DOCTYPE html>
<html> <!-- Tag pembuka HTML -->
<head> <!-- Bagian head untuk metadata -->
    <title>Belajar HTML</title> <!-- Judul halaman yang muncul di tab browser -->
</head>
<body> <!-- Bagian body untuk konten yang ditampilkan -->
    <h1>Selamat Datang</h1> <!-- Heading level 1 -->
    <p>Ini adalah paragraf pertama saya.</p> <!-- Paragraf pertama -->
    
    <!-- Baris kosong untuk pemisah -->
    <p>Ini adalah paragraf kedua saya.</p> <!-- Paragraf kedua -->
</body>
</html>
