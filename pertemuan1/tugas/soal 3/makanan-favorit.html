<!DOCTYPE html>
<html> <!-- Tag pembuka HTML -->
<head> <!-- Bagian head untuk metadata -->
    <title>Makanan Favorit</title> <!-- Judul halaman -->
</head>
<body> <!-- Bagian body untuk konten yang ditampilkan -->

    
    <h1>Daftar Makanan Favorit Saya</h1> <!-- Heading level 1 -->
    
    <!-- Unordered list untuk daftar makanan favorit -->
    <ul> <!-- Tag <ul> membuat daftar tidak berurutan (bullet points) -->
        <li>Nasi Goreng</li> <!-- Tag <li> untuk item dalam daftar -->
        <li>Rendang</li>
        <li>Sate Ayam</li>
        <li>Bakso</li>
        <li>Gado-gado</li>
    </ul>
    
    <hr> <!-- Tag <hr> untuk garis horizontal sebagai pemisah -->
    
    <h2>Tautan Berguna</h2> <!-- Heading level 2, lebih kecil dari h1 -->
    
    <!-- Link eksternal ke Google -->
    <p>
        <a href="https://www.google.com" target="_blank">Kunjungi Google</a> 
        <!-- Tag <a> untuk link, href menentukan tujuan, target="_blank" buka di tab baru -->
    </p>
    
    <!-- Link lokal ke about.html -->
    <p>
        <a href="about.html">Tentang Saya</a> <!-- Link lokal ke file di folder yang sama -->
    </p>
    
    <!-- 
    PENJELASAN:
    - Tag <ul> membuat unordered list (daftar dengan bullet points)
    - Tag <li> untuk setiap item dalam daftar
    - Tag <a> dengan atribut href untuk membuat link/tautan
    - href="https://www.google.com" untuk link eksternal ke Google
    - target="_blank" membuat link terbuka di tab baru
    - href="about.html" untuk link lokal ke file about.html di folder yang sama
    - Tag <hr> untuk garis horizontal sebagai pemisah
    -->
</body>
</html>
