<!DOCTYPE html>
<html> <!-- Tag pembuka HTML -->
<head> <!-- Bagian head untuk metadata -->
    <title>Jadwal Harian</title> <!-- Judul halaman -->
</head>
<body> <!-- Bagian body untuk konten yang ditampilkan -->

    
    <h1>Jadwal Harian</h1> <!-- Heading utama -->
    
    <!-- Unordered list untuk daftar kegiatan harian -->
    <ul> <!-- Tag <ul> membuat daftar tidak berurutan (bullet points) -->
        <li>Bangun pagi</li> <!-- Tag <li> untuk item dalam daftar -->
        <li>Sarapan (Harus <b>sehat</b>)</li> <!-- Tag <b> untuk teks tebal/bold -->
        <li>kuliah (Jangan lupa <i>istirahat</i>)</li> <!-- Tag <i> untuk teks miring/italic -->
        <li>Olahraga</li>
    </ul>
    
</body>
</html>
