<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1 - HTML Struktur & Layout</title>
    <style>
        h1 {
            color: blue;
        
        p {
            font-family: Arial;
            color: gray;
        }
        
        img {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <h1>Judul Halaman</h1>
    
    <p>Ini adalah paragraf dengan font Arial dan warna teks abu-abu.</p>
    
    <img src="image.jpg" alt="Gambar" width="300">
    
    <video controls width="400">
        <source src="video.mp4" type="video/mp4">
        Browser Anda tidak mendukung video HTML5.
    </video>
    
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung audio HTML5.
    </audio>
</body>

</html>
