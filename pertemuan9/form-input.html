<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
    <h1 class="text-3xl font-bold text-blue-500 mb-6">Form Input Tailwind</h1>
    
    <div class="max-w-md bg-white p-6 rounded-xl shadow-lg">
        <form>
            <!-- Input Text -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Nama</label>
                <input 
                    type="text" 
                    placeholder="Masukkan nama" 
                    class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <!-- Input Email -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Email</label>
                <input 
                    type="email" 
                    placeholder="Masukkan email" 
                    class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <!-- Input Password -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    placeholder="Masukkan password" 
                    class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <!-- Textarea -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Pesan</label>
                <textarea 
                    placeholder="Masukkan pesan" 
                    rows="4"
                    class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                ></textarea>
            </div>

            <!-- Select -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Kategori</label>
                <select class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option>Pilih kategori</option>
                    <option>Elektronik</option>
                    <option>Fashion</option>
                    <option>Makanan</option>
                </select>
            </div>

            <!-- Checkbox -->
            <div class="mb-4">
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2">
                    <span class="text-gray-700">Saya setuju dengan syarat dan ketentuan</span>
                </label>
            </div>

            <!-- Button -->
            <button 
                type="submit" 
                class="bg-blue-500 text-white px-4 py-2 rounded w-full hover:bg-blue-600 transition"
            >
                Submit
            </button>
        </form>
    </div>
</body>
</html>
