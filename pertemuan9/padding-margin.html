<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding & Margin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold text-blue-500 mb-6">Padding & Margin</h1>
    
    <!-- 
        Keterangan:
        p-4 = Padding semua sisi
        m-5 = Margin semua sisi
        pt-4 = Padding Top
        mx-auto = Margin kiri kanan otomatis
    -->
    
    <div class="p-4 m-5 bg-gray-200">Box dengan Padding & Margin</div>
</body>
</html>
