<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 5 - Dashboard Responsive</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">

    <h1 class="text-3xl font-bold mb-6">Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-gray-500">Total Produk</h2>
            <p class="text-3xl font-bold text-blue-500">150</p>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-gray-500">Total Penjualan</h2>
            <p class="text-3xl font-bold text-green-500">Rp 25.000.000</p>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-gray-500">Total Member</h2>
            <p class="text-3xl font-bold text-purple-500">320</p>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-gray-500">Total Transaksi</h2>
            <p class="text-3xl font-bold text-orange-500">1.250</p>
        </div>

    </div>

</body>
</html>
