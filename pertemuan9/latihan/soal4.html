<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 4 - Form Input Data Mahasiswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">

    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Data Mahasiswa</h1>
        
        <form>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">NIM</label>
                <input type="text" placeholder="Masukkan NIM" class="border p-2 rounded w-full">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Nama Mahasiswa</label>
                <input type="text" placeholder="Masukkan Nama" class="border p-2 rounded w-full">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Program Studi</label>
                <input type="text" placeholder="Masukkan Program Studi" class="border p-2 rounded w-full">
            </div>

            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full">
                Simpan
            </button>
        </form>
    </div>

</body>
</html>
