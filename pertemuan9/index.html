<script src="https://cdn.tailwindcss.com"></script> 
Contoh lengkap:
 <!DOCTYPE html>
  <html>
     <head>
         <title>Belajar Tailwind</title>
          <script src="https://cdn.tailwindcss.com"> </script>
    </head>
     <body> 
        <h1 class="text-3xl font-bold text-blue-500">
             Hello Tailwind CSS 
            </h1>
            <!-- Konsep Utility Class -->
            <p class="text-red-500">Merah</p>
             <p class="text-green-500">Hijau</p>
            <p class="text-blue-500">Biru</p>
            <!-- Ukuran Font --> 
             <h1 class="text-xl">Extra Large</h1>
              <h1 class="text-3xl">Lebih Besar</h1>
               <h1 class="text-5xl">Sangat Besar</h1>
               <!--Background--> 
               <div class="bg-yellow-300"> Background Kuning </div> 
               <!--Padding & Margin-->
               <!--Keterangan: Class p-4 m-5 pt-4 Fungsi Padding Margin Padding Top mx-auto Margin kiri kanan otomatis -->
               <div class="p-4 m-5 bg-gray-200"> Box </div> 
                <!--Layout dengan Flexbox-->
                <div class="flex gap-4"> <div class="bg-blue-500 p-5">Box 1</div> <div class="bg-red-500 p-5">Box 2</div> </div>
                <!--Grid Layout -->
                <div class="grid grid-cols-3 gap-4"> <div class="bg-blue-300 p-4">1</div> <div class="bg-blue-300 p-4">2</div> <div class="bg-blue-300 p-4">3</div> </div>
         </body>
          </html>
